<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#030604" />
  <title>Poison Garden - Unguentum Mortis</title>
  <link rel="stylesheet" href="style.css" />

  <!-- p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.1/p5.min.js"></script>

  <style>
    body{
      margin:0; 
      background:#030604; 
      color:#fff;
      font-family:'Euphorigenic','Noto Serif KR',serif;
      height:100vh; 
      width:100vw;
      display:flex; 
      justify-content:center; 
      align-items:center;
      overflow: hidden;
    }
    
    .detail-container{ 
      display:flex;
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      max-height: 100vh;
      position: relative;
    }

    /* 화면 비율에 따라 조정 */
    @media (min-aspect-ratio: 16/9) {
      .detail-container {
        width: calc(100vh * 16 / 9);
        height: 100vh;
      }
    }
    @media (max-aspect-ratio: 16/9) {
      .detail-container {
        width: 100vw;
        height: calc(100vw * 9 / 16);
      }
    }

    /* 왼쪽: 인터랙티브 비주얼 (50%) */
    .visual-area{
      width: 50%;
      height: 100%;
      position:relative; 
      display:flex; 
      align-items:center; 
      justify-content:center;
      background:#030604; 
      overflow:hidden;
    }
    
    #js-canvas-container{
      width:100%; 
      height:100%;
      display:flex; 
      align-items:center; 
      justify-content:center; 
      position:relative;
    }
    
    #js-canvas-container canvas {
      max-width: 100% !important;
      max-height: 100% !important;
      width: auto !important;
      height: auto !important;
    }
    
    /* p5가 만드는 <video>는 동작만 하고 화면에 안 보이게 */
    video{ 
      position:absolute; 
      left:-9999px; 
      width:1px; 
      height:1px; 
      opacity:0; 
      pointer-events:none; 
    }

    /* 오른쪽: 설명 이미지 패널 (50%) - 선 제거 */
    .info-area{
      width: 50%;
      height: 100%;
      box-sizing:border-box;
      background:#030604;
      /* border-left 제거 */
      display:flex; 
      align-items:center; 
      justify-content:center;
      overflow:hidden;
      padding: 0; /* 패딩 제거로 이미지가 꽉 차게 */
    }
    
    .info-img{
      width: 100%; 
      height: 100%; /* 세로로 꽉 채우기 */
      object-fit: cover; /* contain에서 cover로 변경 - 세로를 채우고 가로는 잘림 */
      display:block;
      image-rendering:auto;
    }

    .back-link{
      position:absolute; 
      top: 2vh;
      left: 2vh;
      z-index:10;
      color:#fff; 
      font-size: 2vw;
      text-decoration:none;
      transition: opacity 0.3s;
    }
    .back-link:hover {
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <div class="detail-container">
    <div class="visual-area">
      <a href="index.html" class="back-link">&larr;</a>
      <!-- p5 캔버스가 붙는 곳 -->
      <div id="js-canvas-container"></div>
    </div>

    <!-- 오른쪽: 설명 이미지 -->
    <!-- TODO: 설명 이미지 교체-->
    <div class="info-area">
      <img src="images/descriptions/07.png" alt="Bittersweet Drip 설명" class="info-img">
    </div>
  </div>

  
  <!-- p5 스케치 (밝기→이미지 맵핑 로직) -->
  <!-- TODO: js 파일 교체 -->
  <script src="js/07.js"></script>

  <!-- 카메라 장치 접근(권한 유도) -->
  <script>
    navigator.mediaDevices.getUserMedia({ video: true })
      .then(s => { 
        console.log("Camera:", s.getVideoTracks()[0]?.label || "ok"); 
        s.getTracks().forEach(t=>t.stop()); 
      })
      .catch(err => console.error("Camera error:", err));
  </script>
</body>
</html>
