<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#030604" />
  <title>Poison Garden - Unguentum Mortis</title>
  <link rel="stylesheet" href="style.css" />

  <!-- p5.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.1/p5.min.js"></script>

  <style>
    :root{
      --stage-w: min(100vw, calc(100vh * 16 / 9));  /* 화면 비율 16:9에 맞춰 최대한 크게 */
    }

    html, body{
      height:100%;
    }

    body{
      margin:0; 
      background:#030604; 
      color:#fff;
      font-family:'Euphorigenic','Noto Serif KR',serif;
      display:grid; 
      place-items:center;
      overflow:hidden;
    }
    
    /* 16:9 프레임 컨테이너 (홈 화면과 동일한 프레임 크기) */
    .stage{
      width: var(--stage-w);
      aspect-ratio: 16/9;
      position: relative;
    }

    /* 프레임 PNG (검정 배경 + 흰 장식) */
    .frame{
      position:absolute; 
      inset:0;
      z-index: 1000;   /* 추가 */
      pointer-events: none; /* 클릭 막지 않기 */
      background: url("images/designsources/frame_transparent.png") center/contain no-repeat;
    }

    /* 프레임 내부 실제 컨텐츠 영역 */
    .detail-container{ 
      position:absolute;
      inset:0;
      display:flex;
      width: auto;
      height: auto;
      box-sizing:border-box;

      top: 5%;
      bottom: 5%;
      left: 10%;
      right: 3%;
    }

    /* 왼쪽: 인터랙티브 비주얼 (50%) */
    .visual-area{
      width: 50%;
      height: 100%;
      position:relative; 
      display:flex; 
      align-items:center; 
      justify-content:center;
      background:#030604; 
      overflow:hidden;
    }
    
    #js-canvas-container{
      width:100%; 
      height:100%;
      display:flex; 
      align-items:center; 
      justify-content:center; 
      position:relative;
    }
    
    #js-canvas-container canvas {
      max-width: 100% !important;
      max-height: 100% !important;
      width: auto !important;
      height: auto !important;
      object-fit: contain;
    }
    
    /* p5가 만드는 <video>는 동작만 하고 화면에 안 보이게 */
    video{ 
      position:absolute; 
      left:-9999px; 
      width:1px; 
      height:1px; 
      opacity:0; 
      pointer-events:none; 
    }

    /* 오른쪽: 설명 이미지 패널 (50%) */
    .info-area{
      width: 50%;
      height: 100%;
      box-sizing:border-box;
      background:#030604;
      display:flex; 
      align-items:center; 
      justify-content:center;
      overflow:hidden;
      padding: 0;
    }
    
    .info-img{
      width: 100%; 
      height: 100%;
      object-fit: contain;
      background: black;
      /* display:block;
      image-rendering:auto; */
    }

    .back-icon{
      position:absolute;
      top: 10%;
      left: 3%;
      z-index: 2000;
      width: 25px;
      height: auto;
      display:block;
    }

    .back-icon img{
      width:100%;
      height:auto;
      display:block;
    }
  
  </style>
</head>

<body>
  <main class="stage">
    <div class="frame" aria-hidden="true"></div>

    <a href="index.html" class="back-icon">
          <img src="images/designsources/back_icon.png" alt="뒤로가기" />
    </a>
    <div class="detail-container">
      <div class="visual-area">
        
        <!-- p5 캔버스가 붙는 곳 -->
        <div id="js-canvas-container"></div>
      </div>

      <!-- 오른쪽: 설명 이미지 -->
      <div class="info-area">
        <img src="images/descriptions/16.png" alt="Eternal Thorn 설명" class="info-img">
      </div>
    </div>
  </main>

  <!-- p5 스케치 (밝기→이미지 맵핑 로직) -->
  <script src="js/16.js"></script>

  <!-- 카메라 장치 접근(권한 유도) -->
  <script>
    navigator.mediaDevices.getUserMedia({ video: true })
      .then(s => { 
        console.log("Camera:", s.getVideoTracks()[0]?.label || "ok"); 
        s.getTracks().forEach(t=>t.stop()); 
      })
      .catch(err => console.error("Camera error:", err));
  </script>
</body>
</html>
