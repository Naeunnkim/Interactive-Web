<!DOCTYPE html>

<title>Poison Garden</title>

<link rel="stylesheet" href="style.css" />

<style>
  :root{
    /* --stage-w: min(92vw, 1700px); */
    --stage-w: min(100vw, calc(100vh * 16 / 9));
    --gap: clamp(14px, 1.2vw, 24px);
    --frame-pad: clamp(20px, 3vw, 56px);      /* 프레임 안쪽 여백(모서리 장식 피하기) */
    --title-top: clamp(10px, 1.8vw, 22px);    /* 타이틀 y 위치 */
  }
  html,body{height:100%}
  body{
    margin:0; background:#000; color:#fff;
    display:grid; place-items:center; overflow:hidden;
    font-family: 'Euphorigenic','Noto Serif KR', serif;
  }

  /* 16:9 중앙 스테이지 */
  .stage{
    width: var(--stage-w);
    /* max-width: 1700px; */
    aspect-ratio: 16/9;
    position: relative;
  }

  /* 배경 프레임 PNG: 투명 중앙 + 흰 라인/코너 */
  .frame{
    position:absolute; inset:0;
    background: url("images/designsources/frame_transparent.png") center/contain no-repeat;
  }

  /* 실제 콘텐츠 영역(프레임 안쪽 안전 구역) */
  .content{
    position:absolute; inset:0;
    /* padding: 30px; */
    display:flex; flex-direction:column; align-items:center;
    justify-content:center;
  }

  /* 갤러리 그리드: 6열(가변), 여백 균등 */
  .gallery-grid{
    width:100%;                   /* ← 전체 폭 대비 살짝 여유 */
    max-width: 1700px;           /* ← 프레임 안쪽에 fit */
    margin-top: clamp(48px, 10vh, 120px);
    display:grid;
    grid-template-columns: repeat(6, 1fr);
    gap: var(--gap);
    justify-items:center;
    align-items:center;
    margin-inline:auto;
  }
  @media (max-width:1400px){ .gallery-grid{ grid-template-columns: repeat(5, 1fr);} }
  @media (max-width:1100px){ .gallery-grid{ grid-template-columns: repeat(4, 1fr);} }
  @media (max-width:860px) { .gallery-grid{ grid-template-columns: repeat(3, 1fr);} }

  .plant-button{ 
    display:flex; width:100%; aspect-ratio: 3/4;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    border: none;
}

  .plant-image{
    width:100%;
    height:100%;
    object-fit:contain;        /* 비율 유지해서 꽉 넣기 */
    display:block;
    background:transparent;    /* 필요하면 #000 으로 바꿔도 됨 */
    box-shadow:none;           /* 이전에 넣어둔 inset 라인 제거 */
    border:none;
  }
  .plant-image:hover{
    /* transform: translateY(-2px) scale(1.02);
    box-shadow: 0 6px 18px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.15) inset;
    opacity: .95; */
    filter: grayscale(100%);   /* 흑백 변환만 유지 */
    transform: none;           /* 확대 효과 제거 */
    box-shadow: none;          /* 그림자 제거 */
    opacity: 1; 
  }
</style>
</head>

<script>
    document.addEventListener('DOMContentLoaded', () => {
    const imgs = document.querySelectorAll('.plant-image[data-bm]');

    imgs.forEach(img => {
        const original = img.getAttribute('src');
        const bm       = img.getAttribute('data-bm');

        // 원본 경로 저장
        img.dataset.original = original;

        img.addEventListener('mouseenter', () => {
        img.src = bm;
        });

        img.addEventListener('mouseleave', () => {
        img.src = img.dataset.original;
        });
    });
    });
</script>
